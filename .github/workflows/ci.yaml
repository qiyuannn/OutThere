name: CI

on: 
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-and-test:
    name: Lint, Type, Tests, & Web Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src

      - name: Test
        run: npm test

      - name: Test Web Export
        run: npx expo export -p web
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  database-rls: 
    name: Supabase RLS and DB test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start temp supabase
        run: supabase start

      - name: Run Schema and RLS test
        run: supabase test db

      - name: Stop temp supabase
        if: always()
        run: supabase stop --no-backup

